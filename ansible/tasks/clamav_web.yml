---
# Install ClamAV
- name: Install ClamAV
  become: true
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-daemon
    state: present
    update_cache: yes

# Ensure Directories Exist
- name: Ensure ClamAV database directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/clamav
    state: directory
    owner: clamav
    group: clamav
    mode: '0755'

- name: Ensure ClamAV quarantine directory exists
  become: true
  ansible.builtin.file:
    path: /quarantine/clamav
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Ensure ClamAV log directory exists
  become: true
  ansible.builtin.file:
    path: /var/log/clamav
    state: directory
    owner: clamav
    group: adm
    mode: '0750'

# Schedule Weekly Scan
- name: Disable cron mail for ClamAV scan
  become: true
  ansible.builtin.cron:
    name: MAILTO
    user: root
    cron_file: clamav_scan
    env: true
    job: ""

- name: Schedule weekly ClamAV scan
  become: true
  ansible.builtin.cron:
    name: "weekly ClamAV scan"
    user: root
    minute: "0"
    hour: "3"
    weekday: "0"
    cron_file: clamav_scan
    env:
      MAILTO: ""
    job: >
      /usr/bin/ionice -c3
      /usr/bin/nice -n19
      /usr/bin/clamdscan
      --fdpass
      --multiscan
      --recursive
      --infected
      --move=/quarantine/clamav
      --log=/var/log/clamav/scan.log
      --summary
      --max-scantime=3600
      --exclude-dir='^/quarantine'
      --exclude-dir='^/proc'
      --exclude-dir='^/sys'
      --exclude-dir='^/dev'
      --exclude-dir='^/run'
      --exclude-dir='^/snap'
      --exclude-dir='^/var/cache'
      --exclude-dir='^/var/log'
      --exclude-dir='^/var/lib/docker'
      --exclude-dir='^/var/lib/containerd'
      -r /var/www /srv/shiny-server /tmp /var/tmp /home

# Start and Enable
- name: Start and enable freshclam services
  become: true
  ansible.builtin.service:
    name: clamav-freshclam
    state: started
    enabled: true

- name: Start and enable clamav daemon
  become: true
  ansible.builtin.service:
    name: clamav-daemon
    state: started
    enabled: true
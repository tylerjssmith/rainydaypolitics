---
# Install Fail2Ban
- name: Install Fail2Ban
  become: true
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure Fail2Ban for sshd
  become: true
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      port     = 22
      filter   = sshd
      backend  = systemd
      logpath  = /var/log/auth.log
      findtime = 10m
      maxretry = 5
      bantime  = 1h
      bantime.increment = true
      bantime.factor    = 4
      bantime.maxtime   = 24h
  notify: "restart fail2ban"
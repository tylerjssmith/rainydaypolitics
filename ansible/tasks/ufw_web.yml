---
# Install UFW
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes

# Set Defaults
- name: Deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# Set Rules
- name: HTTP
  community.general.ufw:
    rule: allow
    port: 80
    proto: tcp
    log: true

- name: HTTPS
  community.general.ufw:
    rule: allow
    port: 443
    proto: tcp
    log: true

- name: SSH
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp
    log: true

# Enable Logging
- name: Enable UFW logging
  community.general.ufw:
    logging: 'medium'

# Enable at Boot
- name: Enable UFW
  community.general.ufw:
    state: enabled
